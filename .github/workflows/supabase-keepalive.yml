name: Supabase keep-alive

# Supabase free-tier projects pause after about a week without activity.
# This makes a small read against the public marketplace table every 2 days.
# It uses the same publishable key that already ships in the client bundle.

on:
  schedule:
    - cron: "17 2 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            -H "apikey: sb_publishable_e4Va8w2ihrstELS4uat06A_h3cxhwAR" \
            -H "Authorization: Bearer sb_publishable_e4Va8w2ihrstELS4uat06A_h3cxhwAR" \
            "https://dokgjfraatfzdnzqftvy.supabase.co/rest/v1/rental_vehicles?select=id&limit=1")
          echo "HTTP $code"
          cat /tmp/resp.json
          test "$code" = "200"
